      ${sent(c.id) ? '<span class="tag t-ok">Enviado</span>' : `<a class="btn btn-wa btn-sm" href="#" onclick="return campSend(this,'${id}','${c.id}')">${ic('chat', 14)} Enviar</a>`}</div>`).join('')}</div>`
      : '<div class="empty">No hay destinatarios para esta campaña ahora.</div>'}
    <p class="muted" style="font-size:12px;margin:14px 0 0">En la demo cada envío abre WhatsApp con el mensaje listo. Con WhatsApp Business API los envíos salen automáticos.</p></div>`, true);
  campPreview(id);
}
function campPreview(id) { const l = campList(id)[0], el = $('#tplP'); if (!el) return; el.innerHTML = l ? `<small>Vista previa para ${esc(first(l.c.nombre))}</small>${esc(campText(id, l.c, l.t))}` : ''; }
function campSend(a, id, cid) {
  const c = C(cid), t = id === 'manana' ? DB.turnos.find(x => x.clienteId === cid && sod(x.ts) === sod(Date.now()) + DAY && isBusy(x)) : null;
  window.open(waLink(c.telefono, campText(id, c, t)), '_blank', 'noopener');
  logEnvio(id, cid); a.outerHTML = '<span class="tag t-ok">Enviado</span>';
  return false;
}
function cuponForm() {
  openModal(mh('Crear cupón', 'Se usa escribiendo el código en el mostrador') + `<form class="m-b" id="kf" onsubmit="event.preventDefault();saveCupon()">
    <div class="row2"><div class="field"><label class="fl" for="k-c">Código</label><input class="input" id="k-c" maxlength="14" placeholder="Ej: NOVIEMBRE10" style="text-transform:uppercase" required></div>
    <div class="field"><label class="fl" for="k-p">Descuento (%)</label><input class="input" id="k-p" type="number" min="1" max="100" value="10" required></div></div>
    <div class="row2"><div class="field"><label class="fl" for="k-d">Para qué es</label><input class="input" id="k-d" placeholder="Ej: Promo de noviembre"></div>
    <div class="field"><label class="fl" for="k-v">Vigencia (días)</label><input class="input" id="k-v" type="number" min="1" value="30"></div></div></form>
    <div class="m-f"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-main" onclick="$('#kf').requestSubmit()">Crear cupón</button></div>`);
  setTimeout(() => $('#k-c')?.focus(), 50);
}
function saveCupon() {
  const code = $('#k-c').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''), pctv = Math.min(100, Math.max(1, +$('#k-p').value || 0));
  if (code.length < 3) { toast('El código necesita al menos 3 letras o números'); return; }
  if (DB.cupones.some(k => k.code === code)) { toast(`Ya existe el cupón ${code}`); return; }
  const t = sod(Date.now());
  DB.cupones.unshift({code, pct: pctv, desc: $('#k-d').value.trim() || `${pctv}% de descuento`, desde: t, hasta: t + (+$('#k-v').value || 30) * DAY, activo: true});
  touch(); closeModal(); render(); toast(`Cupón ${code} creado`);
}
function cuponToggle(code) { const k = DB.cupones.find(x => x.code === code); k.activo = !k.activo; if (k.activo && k.hasta < Date.now()) k.hasta = sod(Date.now()) + 30 * DAY; touch(); render(); toast(k.activo ? `Cupón ${code} activo` : `Cupón ${code} pausado`); }
function clubForm() {
  const k = DB.club;
  openModal(mh('Configurar el club', 'Los cambios aplican a las próximas visitas') + `<form class="m-b" id="clf" onsubmit="event.preventDefault();saveClub()">
    <div class="row2"><div class="field"><label class="fl" for="cl-n">Nombre del club</label><input class="input" id="cl-n" value="${esc(k.nombre)}"></div>
    <div class="field"><label class="fl" for="cl-m">Sellos para el premio</label><select class="select" id="cl-m">${[5, 6, 8, 10, 12].map(n => `<option ${n === k.meta ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label class="fl" for="cl-s">Servicio de regalo</label><select class="select" id="cl-s">${DB.servicios.map(v => `<option value="${v.id}" ${v.id === k.premioSvc ? 'selected' : ''}>${esc(v.nombre)} (${money(v.precio)})</option>`).join('')}</select></div>
    <div class="field"><label class="fl" for="cl-p">Cómo se anuncia el premio</label><input class="input" id="cl-p" value="${esc(k.premio)}"></div></div></form>
    <div class="m-f"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-main" onclick="$('#clf').requestSubmit()">Guardar</button></div>`);
}
function saveClub() {
  Object.assign(DB.club, {nombre: $('#cl-n').value.trim() || 'Club Bacano', meta: +$('#cl-m').value, premioSvc: $('#cl-s').value, premio: $('#cl-p').value.trim() || V($('#cl-s').value).nombre + ' gratis'});
  touch(); closeModal(); render(); toast('Club actualizado');
}

/* =====================================================================
   7. Modal, toast, tooltip
   ===================================================================== */
function openModal(html, wide = false) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="ov" onmousedown="if(event.target===this)closeModal()"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  requestAnimationFrame(() => root.firstChild.classList.add('on'));
  document.body.style.overflow = 'hidden';
}
function closeModal() { $('#modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
function confirm2(title, text, okLbl, onOk) {
  openModal(`<div class="m-h"><h2>${esc(title)}</h2></div><div class="m-b"><p style="margin:0;color:var(--ink-2)">${esc(text)}</p></div>
  <div class="m-f"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-red" id="okBtn">${esc(okLbl)}</button></div>`);
  $('#okBtn').onclick = () => { closeModal(); onOk(); };
}
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = ic('check', 16) + esc(msg); $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('click', e => { if (!e.target.closest('.cli-box')) { const s = $('#cliSug'); if (s) s.innerHTML = ''; } });
(() => { const tip = $('#tip');
  const show = (e) => { const t = e.target.closest?.('[data-tip]'); if (!t) { tip.classList.remove('on'); return; }
    tip.innerHTML = t.getAttribute('data-tip'); tip.classList.add('on');
    const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 8) y = e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; };
  document.addEventListener('mousemove', show); document.addEventListener('touchstart', e => show(e.touches[0] ? Object.assign({}, e.touches[0], {target: e.target, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY}) : e), {passive: true});
  document.addEventListener('scroll', () => tip.classList.remove('on'), {passive: true}); })();

/* =====================================================================
   8. Acceso del equipo, permisos y navegación
   Adelante: página pública (turnero, club, WhatsApp).
   Detrás de "Acceso del equipo" (#acceso): el panel (#panel/<pantalla>).
   ===================================================================== */
const VB = {nombre: 'VINCULAR BUSINESS', tel: '(387) 4484132', wa: '5493874484132', mail: 'vincularbusiness@gmail.com', lema: 'Tu idea, en buenas manos.'};
const USERS = [
  {id: 'u1', nombre: 'Administrador', titulo: 'Dueño · todas las sucursales', rol: 'admin', pin: '1111'},
  {id: 'u2', nombre: 'Julián Ferreyra', titulo: 'Encargado · Bacano Centro', rol: 'encargado', sucursalId: 'centro', barberoId: 'b1', pin: '2222'},
  {id: 'u3', nombre: 'Lucas Medina', titulo: 'Encargado · Bacano Norte', rol: 'encargado', sucursalId: 'norte', barberoId: 'b5', pin: '3333'},
  {id: 'u4', nombre: 'Tomás Gutiérrez', titulo: 'Barbero · Bacano Centro', rol: 'barbero', sucursalId: 'centro', barberoId: 'b3', pin: '4444'}
];
const PERMS = {
  admin: ['dashboard', 'agenda', 'pos', 'ranking', 'crm', 'marketing', 'sucursales'],
  encargado: ['dashboard', 'agenda', 'pos', 'ranking', 'crm', 'marketing'],
  barbero: ['agenda', 'pos', 'misnumeros', 'crm']
};
const ROL_LBL = {admin: 'Administrador', encargado: 'Encargado', barbero: 'Barbero'};
let SESSION = null;
const ACC = {uid: null, pin: '', err: ''};
try { const s = JSON.parse(sessionStorage.getItem('bacano_sess') || 'null'); SESSION = USERS.find(u => u.id === s?.uid) || null; } catch (e) {}
const allowed = v => !!SESSION && PERMS[SESSION.rol].includes(v);
const homeOf = () => SESSION.rol === 'admin' ? 'dashboard' : 'agenda';
const isAdmin = () => SESSION?.rol === 'admin';

function vMisNumeros() { return `<div class="card">${barberBody(SESSION.barberoId, true)}</div>`; }

function applySession() {
  if (!SESSION) return;
  if (SESSION.sucursalId) { UI.branch = SESSION.sucursalId; if (POS) POS.sucursalId = SESSION.sucursalId; }
}
function login(u) {
  SESSION = u; ACC.uid = null; ACC.pin = ''; ACC.err = '';
  try { sessionStorage.setItem('bacano_sess', JSON.stringify({uid: u.id})); } catch (e) {}
  UI.branch = 'all'; applySession(); resetPos();
  go(homeOf()); toast(`Hola, ${first(u.nombre)}. Ingresaste como ${ROL_LBL[u.rol].toLowerCase()}.`);
}
function logout() {
  SESSION = null; try { sessionStorage.removeItem('bacano_sess'); } catch (e) {}
  UI.branch = 'all'; closeModal(); location.hash = 'acceso';
}

function renderAcceso() {
  const u = ACC.uid ? USERS.find(x => x.id === ACC.uid) : null;
  $('#acc').innerHTML = `<div class="acc-card">
    <img class="acc-logo" src="${LOGO}" alt="Bacano">
    <h1>Acceso del equipo</h1><p class="acc-sub">Bacano Show Room · Barber Shop</p>
    ${u ? `<div class="acc-who">${uav(u)}<div style="flex:1;min-width:0"><b>${esc(u.nombre)}</b><small>${esc(u.titulo)}</small></div><button class="btn btn-ghost btn-sm" onclick="ACC.uid=null;ACC.pin='';ACC.err='';renderAcceso()">Cambiar</button></div>
      <p class="fl" style="text-align:center;margin:18px 0 10px">Ingresá tu PIN de 4 dígitos</p>
      <div class="pin-dots ${ACC.err ? 'bad' : ''}" aria-live="polite">${[0, 1, 2, 3].map(i => `<i class="${i < ACC.pin.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="acc-err">${esc(ACC.err)}</div>
      <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => k ? `<button aria-label="${k === '⌫' ? 'Borrar' : k}" onclick="pinKey('${k}')">${k}</button>` : '<span></span>').join('')}</div>
      <p class="acc-hint">Demo: el PIN de ${esc(first(u.nombre))} es <b>${u.pin}</b>.</p>`
    : `<p class="fl" style="margin:18px 0 10px">¿Quién ingresa?</p>
      <div class="acc-users">${USERS.map(x => `<button onclick="ACC.uid='${x.id}';renderAcceso()">${uav(x)}<span style="flex:1;min-width:0"><b>${esc(x.nombre)}</b><small>${esc(x.titulo)}</small></span><span class="tag t-mute">${ROL_LBL[x.rol]}</span></button>`).join('')}</div>
      <p class="acc-hint">Cada rol ve lo que le corresponde: el administrador todo, el encargado su sucursal y el barbero su agenda y sus números.</p>`}
    <button class="btn btn-line btn-block" style="margin-top:14px" onclick="location.hash='reservar'">Volver a la página pública</button>
    ${vbBlock()}
  </div>`;
}
const uav = u => u.barberoId ? av(B(u.barberoId), '') : `<span class="av" style="background:var(--ink)">${ic('star', 16)}</span>`;
function vbBlock() {
  return `<div class="vb"><img src="${VB_BANNER}" alt="VINCULAR BUSINESS: digitalización, software de gestión y fidelización para comercios y servicios de Argentina" loading="lazy">
    <div class="vb-cta"><a class="btn btn-wa btn-sm" href="https://wa.me/${VB.wa}" target="_blank" rel="noopener">${ic('chat', 15)} WhatsApp ${VB.tel}</a><a class="btn btn-line btn-sm" href="tel:+${VB.wa}">${ic('phone', 15)} Llamar</a><a class="btn btn-line btn-sm" href="mailto:${VB.mail}">Correo</a></div>
    <p>Desarrollado por <b>${VB.nombre}</b> · Único celular ${VB.tel} · ${VB.mail}<br><i>“${VB.lema}”</i></p></div>`;
}
function pinKey(k) {
  const u = USERS.find(x => x.id === ACC.uid); if (!u) return;
  ACC.err = '';
  if (k === '⌫') ACC.pin = ACC.pin.slice(0, -1); else if (ACC.pin.length < 4) ACC.pin += k;
  if (ACC.pin.length === 4) {
    if (ACC.pin === u.pin) { renderAcceso(); setTimeout(() => login(u), 120); return; }
    ACC.err = 'PIN incorrecto. Probá de nuevo.'; ACC.pin = '';
  }
  renderAcceso();
}
document.addEventListener('keydown', e => {
  if (!/^#acceso/.test(location.hash) || !ACC.uid) return;
  if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('⌫');
});

/* Rutas: '' / #reservar / #tarjeta=… → pública · #acceso → ingreso · #panel/<vista> → panel */
function showOnly(id) { ['app', 'pub', 'acc'].forEach(x => { const el = x === 'app' ? $('.app') : $('#' + x); el.style.display = x === id ? '' : 'none'; }); }
function go(v) {
  if (!SESSION) { location.hash = 'acceso'; return; }
  UI.view = allowed(v) ? v : homeOf(); closeModal();
  const h = '#panel/' + UI.view;
  if (location.hash !== h) { try { history.pushState(null, '', h); } catch (e) { location.hash = h; return; } }
  showOnly('app'); render(); window.scrollTo({top: 0});
}
function route() {
  const h = location.hash;
  if (/^#panel/.test(h)) {
    if (!SESSION) { history.replaceState(null, '', '#acceso'); showOnly('acc'); renderAcceso(); return; }
    applySession();
    const v = h.split('/')[1]; UI.view = allowed(v) ? v : homeOf();
    showOnly('app'); render(); return;
  }
  if (/^#acceso/.test(h)) {
    if (SESSION) { go(homeOf()); return; }
    closeModal(); showOnly('acc'); renderAcceso(); window.scrollTo({top: 0}); return;
  }
  closeModal(); showOnly('pub'); renderPub(); window.scrollTo({top: 0});
  const m = h.match(/^#tarjeta=([\w-]+)/); if (m && C(m[1])) cardModal(m[1]);
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
function setBranch(b) { if (SESSION?.sucursalId) return; UI.branch = b; if (b !== 'all') posBranch.call(null, b); render(); }
function setPeriod(p) { UI.period = p; render(); }
function render() {
  if (!SESSION) return;
  const views = VIEWS.filter(x => allowed(x.id));
  const v = VIEWS.find(x => x.id === UI.view);
  $('#nav').innerHTML = views.map(x => `<button class="${x.id === UI.view ? 'on' : ''}" onclick="go('${x.id}')">${ic(x.icon, 19)}${x.label}</button>`).join('');
  $('#mtabs').innerHTML = views.map(x => `<button class="${x.id === UI.view ? 'on' : ''}" onclick="go('${x.id}')">${x.label}</button>`).join('') + `<button onclick="location.hash='reservar'">Página pública</button><button onclick="logout()">Salir</button>`;
  $('#userBox').innerHTML = `<div class="ubox">${uav(SESSION)}<div style="min-width:0;flex:1"><b>${esc(SESSION.nombre)}</b><small>${esc(SESSION.titulo)}</small></div><button class="btn btn-ghost btn-sm" onclick="logout()" title="Cerrar sesión">Salir</button></div>`;
  const sub = {pos: 'Registrá servicios y cobrá en el momento', crm: 'Historial, preferencias, club y contacto', agenda: `${branchLabel()} · reservas online, WhatsApp y mostrador`, marketing: `${branchLabel()} · campañas, cupones y tarjeta de sellos`, misnumeros: `${esc(SESSION.nombre)}, ${periodLabel()}`}[UI.view] || `${branchLabel()}, ${periodLabel()}`;
  $('#title').innerHTML = `${v.title}<span>${esc(sub)}</span>`;
  const locked = !!SESSION.sucursalId;
  $('#branchSeg').style.display = UI.view !== 'pos' && UI.view !== 'misnumeros' && !locked ? '' : 'none';
  $('#periodSeg').style.display = UI.view !== 'pos' && !['crm', 'agenda', 'marketing'].includes(UI.view) ? '' : 'none';
  $('#branchSeg').innerHTML = [['all', 'Todas', '#f5f3ef'], ...DB.sucursales.map(s => [s.id, s.nombre.replace('Bacano ', ''), s.color])].map(([id, l, c]) => `<button class="${UI.branch === id ? 'on' : ''}" onclick="setBranch('${id}')"><i class="dot" style="background:${c}"></i>${l}</button>`).join('');
  $('#periodSeg').innerHTML = PERIODS.map(([id, l]) => `<button class="${UI.period === id ? 'on' : ''}" onclick="setPeriod('${id}')">${l}</button>`).join('');
  $('#view').innerHTML = {dashboard: vDashboard, agenda: vAgenda, pos: vPos, ranking: vRanking, crm: vCrm, marketing: vMarketing, sucursales: vSucursales, misnumeros: vMisNumeros}[UI.view]();
}
function tick() { const d = new Date(); const s = d.toLocaleDateString('es-AR', {weekday: 'short', day: 'numeric', month: 'short'}) + ' · ' + fTime(d); document.querySelectorAll('.clk').forEach(e => e.textContent = s); }

/* Arranque */
load(); resetPos(); applySession(); route(); tick(); setInterval(tick, 15000);
</script>
